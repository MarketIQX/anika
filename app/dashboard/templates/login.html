<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Anika</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="text-2xl font-semibold text-slate-800">Anika</div>
      <div class="text-xs text-slate-500 tracking-wide uppercase">for CA S V Prakasha</div>
    </div>

    <form method="post" action="/login" class="bg-white border border-slate-200 rounded-lg p-6 space-y-4">
      <input type="hidden" name="next" value="{{ next }}" />

      {% if error %}
        <div class="p-3 bg-rose-100 text-rose-800 rounded text-sm">{{ error }}</div>
      {% endif %}

      <div>
        <label class="block text-sm text-slate-600 mb-1">Email</label>
        <input type="email" name="email" required autocomplete="email" autofocus
               class="w-full border border-slate-300 rounded p-2 text-sm focus:outline-none focus:border-slate-900" />
      </div>
      <div>
        <label class="block text-sm text-slate-600 mb-1">Password</label>
        <input type="password" name="password" required autocomplete="current-password"
               class="w-full border border-slate-300 rounded p-2 text-sm focus:outline-none focus:border-slate-900" />
      </div>

      <button type="submit"
              class="w-full py-2 bg-slate-900 hover:bg-slate-800 text-white font-medium rounded-md">
        Sign in
      </button>
    </form>

    <p class="mt-4 text-xs text-slate-500 text-center">
      Session expires after {{ 7 }} days of inactivity.
    </p>
  </div>
</body>
</html>
